# Juntia project configuration.
#
# `juntia init` scaffolds this so a project has one canonical place for
# Juntia settings. `juntia setup`/`juntia integrate` read and write the
# `runtime.provider` and `integrations` fields below (Phase 13A/12L) — every
# other field is still reserved for a future phase, not yet read by any code.

schema_version: 1

project:
  name: null # fill in; not required by anything yet

# Which AI assistant you told `juntia setup` (or manually configured via
# `juntia integrate <runtime>`) you use — a record of your stated
# preference, not yet a routing mechanism: nothing in this codebase reads
# this value back to select which adapter `analyze --explain` actually
# calls (that's a separate, still-unbuilt gap — see docs/
# RUNTIME_INTEGRATION.md's "provider adapter interface" section). One
# provider at a time, unlike `integrations` below. Examples (illustrative,
# not all implemented):
#   runtime:
#     provider: claude-code
#   runtime:
#     provider: openai
#     model: gpt-5
#   runtime:
#     provider: ollama
#     model: qwen
runtime:
  provider: null
  model: null

# Which AI coding runtimes this project has a generated adaptation for (see
# docs/RUNTIME_INTEGRATION.md) — e.g. a generated CLAUDE.md counts as
# "claude-code" here. Distinct from `runtime` above: a project can integrate
# with several runtimes at once, but `runtime.provider` only ever names one.
# Written by `juntia setup` or `juntia integrate <runtime>`.
integrations: []
